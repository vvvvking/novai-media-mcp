[project]
name = "novai-media-mcp"
version = "0.1.0"
description = "MCP server: generate images and video with Chinese models (Seedream, Hailuo, Kling, Seedance) through one OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NovAI", email = "support@aiapi-pro.com" }]
keywords = ["mcp", "image-generation", "video-generation", "seedream", "hailuo", "chinese-ai"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Homepage = "https://aiapi-pro.com"
Repository = "https://github.com/vvvvking/novai-media-mcp"

[project.scripts]
novai-media-mcp = "server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
